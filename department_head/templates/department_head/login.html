
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Department Head Login | Smart City Uganda</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
        <div class="card shadow-sm border-0 p-4 w-100" style="max-width: 430px;">
            <h3 class="text-center mb-2">Smart City Uganda</h3>
            <p class="text-center text-muted mb-4">Department Head Portal</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'warning' }}" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form
                method="post"
                action="{% url 'department_head:login' %}"
                autocomplete="on"
            >
                {% csrf_token %}

                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input
                        type="text"
                        name="username"
                        id="username"
                        class="form-control"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        name="password"
                        id="password"
                        class="form-control"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Login
                </button>
            </form>
        </div>
    </div>
</body>
</html>
