{% extends "department_head/base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <h2><i class="bi bi-gear"></i> Settings</h2>
    <p class="text-muted">Customize your Department Head portal.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}

                <h5 class="mb-3">Appearance</h5>

                <div class="mb-4">
                    <label for="theme" class="form-label">Portal theme</label>
                    <select name="theme" id="theme" class="form-select">
                        <option value="light"
                            {% if active_theme == "light" %}selected{% endif %}>
                            Default Light
                        </option>
                        <option value="green"
                            {% if active_theme == "green" %}selected{% endif %}>
                            Green
                        </option>
                        <option value="blue"
                            {% if active_theme == "blue" %}selected{% endif %}>
                            Blue
                        </option>
                        <option value="dark"
                            {% if active_theme == "dark" %}selected{% endif %}>
                            Dark
                        </option>
                        <option value="black"
                            {% if active_theme == "black" %}selected{% endif %}>
                            Black
                        </option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-circle"></i> Save Settings
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
