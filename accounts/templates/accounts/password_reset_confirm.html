{% extends "auth_base.html" %}
{% block content %}
<div class="container py-5">
    <div class="card shadow-sm mx-auto p-4" style="max-width: 480px;">
        {% if validlink %}
            <h3 class="text-success mb-3">Set New Password</h3>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label" for="id_new_password1">
                        New Password
                    </label>
                    <input type="password" name="new_password1"
                           id="id_new_password1" class="form-control" required>
                    {{ form.new_password1.errors }}
                </div>

                <div class="mb-3">
                    <label class="form-label" for="id_new_password2">
                        Confirm New Password
                    </label>
                    <input type="password" name="new_password2"
                           id="id_new_password2" class="form-control" required>
                    {{ form.new_password2.errors }}
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Reset Password
                </button>
            </form>
        {% else %}
            <h3 class="text-danger">Invalid or Expired Link</h3>
            <p>Request another password reset link.</p>
            <a href="{% url 'accounts:password_reset' %}"
               class="btn btn-success">Request New Link</a>
        {% endif %}
    </div>
</div>
{% endblock %}
