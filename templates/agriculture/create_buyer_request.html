{% extends "base.html" %}

{% block title %}Buyer Request{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow-sm">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">
                <i class="bi bi-person-search"></i>
                Submit Buyer Request
            </h3>
        </div>

        <div class="card-body">

            <p class="text-muted">
                Tell farmers what agricultural products you need.
            </p>

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-send"></i>
                    Submit Request
                </button>

                <a href="{% url 'agriculture:market' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
