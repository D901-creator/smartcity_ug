{% extends "base.html" %}

{% block title %}Add Agricultural Input{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow-sm">

        <div class="card-header bg-success text-white">

            <h3 class="mb-0">
                <i class="bi bi-box-seam"></i>
                Add Agricultural Input
            </h3>

        </div>

        <div class="card-body">

            <p class="text-muted">
                Add seeds, fertilizers, pesticides, feeds,
                equipment or machinery.
            </p>


            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}


                <button type="submit"
                        class="btn btn-success">

                    <i class="bi bi-check-circle"></i>
                    Save Agricultural Input

                </button>


                <a href="{% url 'agriculture:agricultural_inputs' %}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
