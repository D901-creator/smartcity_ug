{% extends "base.html" %}

{% block title %}Sell Agricultural Product{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow-sm">

        <div class="card-header bg-success text-white">
            <h3 class="mb-0">
                <i class="bi bi-basket"></i>
                List Agricultural Product
            </h3>
        </div>

        <div class="card-body">

            <p class="text-muted">
                Farmers can publish agricultural products for buyers
                across Uganda.
            </p>

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-circle"></i>
                    Publish Product
                </button>

                <a href="{% url 'agriculture:market' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
