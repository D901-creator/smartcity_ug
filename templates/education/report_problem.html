{% extends "base.html" %}

{% block title %}
Report an Education Problem | Smart City Uganda
{% endblock %}

{% block content %}

<div class="container education-module">

    <div class="education-module-header">

        <div class="education-module-icon">
            <i class="bi bi-exclamation-triangle"></i>
        </div>

        <h1>Report an Education Problem</h1>

        <p>
            Submit an education-related problem or complaint for
            appropriate follow-up.
        </p>

    </div>


    <div class="education-form-card">

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="education-button"
            >
                <i class="bi bi-send"></i>
                Submit Report
            </button>

        </form>

    </div>

</div>

{% endblock %}
