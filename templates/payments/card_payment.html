{% extends "base.html" %}

{% block title %}
Card Payment | Smart City Uganda
{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="card border-0 shadow-sm">

        <div class="card-body">

            <h4 class="fw-bold">
                Card Payment
            </h4>

            <p class="text-muted">
                Complete your payment securely.
            </p>

            <div class="alert alert-info">
                Amount:
                <strong>
                    UGX {{ payment.amount|floatformat:0 }}
                </strong>
            </div>

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-primary">
                    Proceed to Secure Payment
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
