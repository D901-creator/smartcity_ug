{% extends "base.html" %}

{% block title %}
Payment Amount | Smart City Uganda
{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="card border-0 shadow-sm">

        <div class="card-body">

            <h4 class="fw-bold mb-1">
                Payment Amount
            </h4>

            <p class="text-muted">
                Confirm how much you want to pay.
            </p>

            <div class="alert alert-info">

                Outstanding balance:

                <strong>
                    UGX {{ bill.balance|floatformat:0 }}
                </strong>

            </div>


            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-success">

                    Continue

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
