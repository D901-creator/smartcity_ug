{% extends "base.html" %}

{% block title %}
Mobile Money Payment | Smart City Uganda
{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="card border-0 shadow-sm">

        <div class="card-body">

            <h4 class="fw-bold">
                <i class="bi bi-phone text-success"></i>
                Mobile Money
            </h4>

            <p class="text-muted">
                Enter the mobile number that will be used for this payment.
            </p>


            <div class="alert alert-info">

                Amount:

                <strong>
                    UGX {{ payment.amount|floatformat:0 }}
                </strong>

            </div>


            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-success">

                    Continue to Payment

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
