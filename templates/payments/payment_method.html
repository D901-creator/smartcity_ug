{% extends "base.html" %}

{% block title %}
Choose Payment Method | Smart City Uganda
{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="card border-0 shadow-sm">

        <div class="card-body">

            <h4 class="fw-bold">
                Choose Payment Method
            </h4>

            <p class="text-muted">
                Select how you want to complete this payment.
            </p>


            <div class="alert alert-light border">

                Amount:

                <strong>
                    UGX {{ payment.amount|floatformat:0 }}
                </strong>

            </div>


            <form method="post">

                {% csrf_token %}

                <div class="row g-3">

                    <div class="col-md-6">

                        <button
                            name="payment_method"
                            value="mobile_money"
                            class="btn btn-outline-success w-100 p-3">

                            <i class="bi bi-phone fs-4"></i>

                            <br>

                            Mobile Money

                            <small class="d-block text-muted">
                                MTN / Airtel
                            </small>

                        </button>

                    </div>


                    <div class="col-md-6">

                        <button
                            name="payment_method"
                            value="card"
                            class="btn btn-outline-primary w-100 p-3">

                            <i class="bi bi-credit-card fs-4"></i>

                            <br>

                            Debit / Credit Card

                        </button>

                    </div>


                    <div class="col-md-6">

                        <button
                            name="payment_method"
                            value="bank"
                            class="btn btn-outline-secondary w-100 p-3">

                            <i class="bi bi-bank fs-4"></i>

                            <br>

                            Bank Payment

                        </button>

                    </div>


                    <div class="col-md-6">

                        <button
                            name="payment_method"
                            value="payway"
                            class="btn btn-outline-warning w-100 p-3">

                            <i class="bi bi-wallet2 fs-4"></i>

                            <br>

                            Payway

                        </button>

                    </div>


                    <div class="col-md-6">

                        <button
                            name="payment_method"
                            value="cash"
                            class="btn btn-outline-dark w-100 p-3">

                            <i class="bi bi-cash-stack fs-4"></i>

                            <br>

                            Cash / Payment Centre

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
